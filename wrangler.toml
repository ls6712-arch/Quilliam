# Lets Cloudflare's Git deploy find the Worker from the repo root.
name = "quilliam"
main = "worker/worker.js"
compatibility_date = "2026-10-01"
# Keep variables set in the Cloudflare dashboard (GOOGLE_CLIENT_ID, MAIL_FROM…) on every Git deploy.
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "quilliam"
database_id = "f3dec12a-6070-4fc0-b90d-b14a5e054274"

[[kv_namespaces]]
binding = "LETTERS"
id = "a54fe60e97e84e45ad8877f1090cbf67"
